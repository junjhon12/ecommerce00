# feat: implement automated testing pipeline
# GitHub Actions was chosen here over external CI platforms to optimize context switching, 
# balancing integrated repository management with readable, declarative YAML configurations.

name: E-commerce CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

# feat: add continuous deployment job to Render
# Utilizing Render's Deploy Hook URL was chosen over managing SSH keys for direct server access 
# to optimize deployment speed and security, balancing operational readability with robust DevOps practices.

  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deployment
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.RENDER_DEPLOY_HOOK }}
          method: 'POST'